# Workflow à ajouter au FORK de coa-vfog (branche covcore) : produit la
# référence Win32 du cœur CPU. Déclenchement manuel ; l'artefact ref-win32.txt
# se compare localement avec : python3 diff_dump.py ref-macos.txt ref-win32.txt
name: win32-refcore
on:
  workflow_dispatch:
jobs:
  ref:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build refcore (Win32, /fp:precise)
        shell: cmd
        run: |
          cl /nologo /O2 /fp:precise /W3 ^
             /I covf-metal\shim /I src ^
             covf-metal\covcore\refcore.cpp src\fog_model.cpp src\fog_data.cpp ^
             /Fe:refcore.exe
      - name: Run
        shell: cmd
        run: refcore.exe data\fogdata.bin ref-win32.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ref-win32
          path: ref-win32.txt
